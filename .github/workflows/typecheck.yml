# This workflow will run the typecheckers 

name: typecheck

on:
  push:
    branches:
      - main
      - 'cu-quantum-**'
  pull_request:
    branches:
      - main
      - 'cu-quantum-**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run mypy src
        run: uv run mypy src/
      
      - name: Run mypy tests
        run: uv run mypy tests/

      - name: Run pyright
        run: uv run pyright